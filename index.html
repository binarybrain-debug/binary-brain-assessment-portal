<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Binary Brain Assessment Portal</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- LOGIN PAGE -->

    <div id="loginPage">

        <h1>🧠 Binary Brain Assessment Portal</h1>

        <h3 id="testTitle">NEET Mock Test 01</h3>

        <input
        type="text"
        id="studentName"
        placeholder="Enter Your Name">

        <input
        type="password"
        id="studentPassword"
        placeholder="Enter Password">

        <button id="loginBtn">
            Start Test
        </button>

    </div>

    <!-- INSTRUCTION PAGE -->

    <div id="instructionPage" style="display:none;">

        <h2>Instructions</h2>

        <ul>

            <li>Total Questions : <b>180</b></li>

            <li>Correct Answer : <b>+4</b></li>

            <li>Wrong Answer : <b>-1</b></li>

            <li>Unattempted : <b>0</b></li>

            <li>Timer will start after clicking Start Test.</li>

        </ul>

        <button id="beginExam">
            Begin Test
        </button>

    </div>

    <!-- TEST PAGE START -->

    <div id="examPage" style="display:none;">

        <div class="topBar">

            <div id="candidateName"></div>

            <div id="timer">
                180:00
            </div>

        </div>

        <div id="questionArea">

        </div>

        <div class="navigation">

            <button id="prevBtn">
                Previous
            </button>

            <button id="nextBtn">
                Next
            </button>

            <button id="submitBtn">
                Submit Test
            </button>

        </div>

    </div>

    <!-- RESULT PAGE -->

    <div id="thankYouPage" style="display:none;">

        <h2>✅ Test Submitted Successfully</h2>

        <p>
            Your response has been recorded.
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
