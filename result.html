<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Brain Result Portal</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<h1>🧠 Binary Brain Result Portal</h1>

<h3 id="testName"></h3>

<input
type="text"
id="studentName"
placeholder="Enter Your Name">

<input
type="password"
id="resultPassword"
placeholder="Enter DOB">
<div id="captchaBox" style="
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
">

    <div id="captchaText" style="
        background:#eeeeee;
        border:1px solid #ccc;
        border-radius:6px;
        padding:12px 20px;
        font-weight:bold;
        letter-spacing:3px;
        min-width:100px;
        text-align:center;
    "></div>

    <input
        type="text"
        id="captchaInput"
        placeholder="Enter CAPTCHA"
        style="
            flex:1;
            margin:0;
        "
    >

    <button
        type="button"
        onclick="generateCaptcha()"
        style="
            width:50px;
            margin:0;
            padding:12px;
        "
    >↻</button>

</div>
<button onclick="checkResult()">
📊 Check Result
</button>
<div id="loading" style="display:none;">
    <div class="loader"></div>
    <p>Checking Result...</p>
</div>
<div id="result"></div>

<div id="analysis"></div>

</div>

<script src="result.js"></script>

</body>
</html>
